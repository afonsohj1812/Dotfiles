source = /home/afonso/Dotfiles/colors/.config/colors/colors.conf
source = /home/afonso/Dotfiles/hyprland/.config/hypr/confs/animations.conf
source = /home/afonso/Dotfiles/hyprland/.config/hypr/confs/autostart.conf
source = /home/afonso/Dotfiles/hyprland/.config/hypr/confs/keybinds.conf
source = /home/afonso/Dotfiles/hyprland/.config/hypr/confs/monitors.conf
source = /home/afonso/Dotfiles/hyprland/.config/hypr/confs/variables.conf
source = /home/afonso/Dotfiles/hyprland/.config/hypr/confs/windowrules.conf


general {
    col.active_border = $red
    col.inactive_border = $black3
    border_size = 2
    gaps_in = 2
    gaps_out = 4
}

decoration {
    rounding = 4
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(0f0f0f7f)
    }
    
    blur {
        enabled = false
    }
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = pt
}
