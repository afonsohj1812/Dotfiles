background_opacity 0.5
font_family JetBrains Mono Nerd Font
font_size 12
confirm_os_window_close 0

# The basic colors
foreground              #ffffff
background              #0f0f0f
selection_foreground    #1f1f1f
selection_background    #ffffff

# Cursor colors
cursor                  #ffffff
cursor_text_color       #1f1f1f

# URL underline color when hovering with mouse
url_color               #ffffff

# Kitty window border colors
active_border_color     #8f8f8f
inactive_border_color   #4f4f4f
bell_border_color       #ffffff

# Tab bar colors
active_tab_foreground   #0f0f0f
active_tab_background   #ffffff
inactive_tab_foreground #8f8f8f
inactive_tab_background #1f1f1f
tab_bar_background      #0f0f0f

# Colors for marks (marked text in the terminal)
mark1_foreground #1f1f1f
mark1_background #8f8f8f
mark2_foreground #1f1f1f
mark2_background #8f8f8f
mark3_foreground #1f1f1f
mark3_background #8f8f8f

# The 16 terminal colors

# black
color0 #1f1f1f
color8 #4f4f4f

# red
color1 #ff3f3f
color9 #ff3f3f

# green
color2  #5bff5b
color10 #5bff5b

# yellow
color3  #ffff5b
color11 #ffff5b

# blue
color4  #3f3fff
color12 #3f3fff

# magenta
color5  #ff00ff
color13 #ff00ff

# cyan
color6  #00ffff
color14 #00ffff

# white
color7  #ffffff
color15 #ffffff

# Central palette (generated from colors/colors.conf) — overrides the above.
include colors.conf
